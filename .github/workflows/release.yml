name: Release

# Publishes to npm when a GitHub release is published, with provenance, through npm trusted publishing
# (OIDC: no npm token stored in GitHub). One-time setup on npmjs.com: package settings → Trusted publisher →
# GitHub Actions, organisation apsulis, repository emdash-light-smtp, workflow release.yml, environment npm.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
